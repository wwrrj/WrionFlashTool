# Wrion FlashTool 展示页（由 website/deploy.ps1 安装，__DOMAIN__ / __ROOT__ 在部署时替换）
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __ROOT__;
    include /etc/nginx/snippets/wrion-flash-stats*.conf;
    include /etc/nginx/snippets/wrion-flash-downloads*.conf;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    # 展示页用同源 iframe 嵌入界面，只允许同源嵌套
    add_header X-Frame-Options SAMEORIGIN always;

    # 构建产物带内容哈希，可以长期缓存（^~ 让它优先于下面的正则规则）
    location ^~ /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 页面本身和 version.json 每次都向服务器确认，更新后立即生效
    location ~* \.(html|js|css|json)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
