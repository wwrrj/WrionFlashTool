[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harusora-flash-tool"
version = "2.0.0"
description = "Harusora team profile-driven Android fastboot flashing tool"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Harusora Team" }]
dependencies = []

[project.scripts]
HarusoraFlashTool = "harusora_flash_tool.app:main"

[tool.setuptools.packages.find]
include = ["harusora_flash_tool*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
